name: Financial AI Red Teaming Framework CI

on:
  push:
    paths:
      - 'projects/financial-ai-red-teaming-framework/**'
      - '.github/workflows/financial-ai-red-teaming-framework.yml'
  pull_request:
    paths:
      - 'projects/financial-ai-red-teaming-framework/**'
      - '.github/workflows/financial-ai-red-teaming-framework.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/financial-ai-red-teaming-framework
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.2"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync pinned dependencies
        run: uv sync --frozen --dev

      - name: Lint with ruff
        run: uv run ruff check src tests scripts

      - name: Run full pytest suite
        run: uv run pytest -v

      - name: Verify reference oracle and reproducibility
        run: |
          uv run fin-redteam verify-oracle --config config/harness_config.json
          uv run python scripts/run_demo.py --verify-baseline

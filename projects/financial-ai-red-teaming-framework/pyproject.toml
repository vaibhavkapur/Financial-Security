[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "financial-ai-red-teaming-framework"
version = "0.1.0"
description = "Offline financial AI red-teaming framework for evaluating prompt injection, unsafe tool requests, and canary secret leakage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Financial-Security Contributors" }
]
dependencies = [
  "pydantic>=2.10,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
fin-redteam = "fin_redteam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
